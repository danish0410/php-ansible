---
# First Play: Install Jenkins on EBS volume and setup Nginx + PHP + Git App
- name: Install Jenkins on EBS volume and setup Nginx + PHP + Git App
  hosts: all
  become: true

  vars:
    github_repo: "git@github.com:danish0410/php-nginx-helloworld.git"
    github_branch: "feature"
    app_dest: "/var/www/html/php-nginx-helloworld"
    index_src: "/var/www/html/php-nginx-helloworld/php-app/index.php"
    jenkins_home: "/mnt/jenkins"
    ebs_device: "/dev/xvdf"
    jenkins_port: 8080

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install required packages
      apt:
        name:
          - php
          - nginx
          - git
          - openjdk-17-jdk
          - curl
          - gnupg2
          - file
          - wget
        state: present

    - name: Ensure Apache is stopped and disabled
      service:
        name: apache2
        state: stopped
        enabled: no
      ignore_errors: true

    - name: Create Jenkins home directory if not exists
      file:
        path: "{{ jenkins_home }}"
        state: directory
        mode: '0755'

    - name: Format EBS volume if not already formatted and not mounted
      shell: |
        if ! file -s {{ ebs_device }} | grep -q "filesystem"; then
          mountpoint -q {{ jenkins_home }} || mkfs -t ext4 {{ ebs_device }}
        fi
      args:
        executable: /bin/bash
        warn: false

    - name: Mount EBS volume to Jenkins directory
      mount:
        src: "{{ ebs_device }}"
        path: "{{ jenkins_home }}"
        fstype: ext4
        opts: defaults
        state: mounted

    - name: Ensure Jenkins old repo entries are removed
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.list
        - /etc/apt/sources.list.d/jenkins.list.save

    - name: Add Jenkins GPG key securely
      get_url:
        url: https://pkg.jenkins.io/debian/jenkins.io-2023.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'

    - name: Add Jenkins APT repository with signed key
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: |
          deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian binary/
        mode: '0644'

    - name: Update apt cache after Jenkins repo setup
      apt:
        update_cache: yes

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present

    - name: Stop Jenkins to configure custom home
      service:
        name: jenkins
        state: stopped

    - name: Update Jenkins config to use custom home
      lineinfile:
        path: /etc/default/jenkins
        regexp: '^JENKINS_HOME='
        line: "JENKINS_HOME={{ jenkins_home }}"
        create: yes
        backup: yes

    - name: Copy existing Jenkins files if any
      shell: |
        if [ -d /var/lib/jenkins ] && [ -z "$(ls -A {{ jenkins_home }})" ]; then
          cp -r /var/lib/jenkins/* {{ jenkins_home }}/
          chown -R jenkins:jenkins {{ jenkins_home }}
        fi
      args:
        warn: false

    - name: Ensure Jenkins home directory has correct ownership
      file:
        path: "{{ jenkins_home }}"
        state: directory
        owner: jenkins
        group: jenkins
        recurse: yes

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Restart Jenkins to apply JENKINS_HOME change
      systemd:
        name: jenkins
        state: restarted
        enabled: yes

    - name: Wait for Jenkins to create initialAdminPassword file
      wait_for:
        path: "{{ jenkins_home }}/secrets/initialAdminPassword"
        state: present
        timeout: 180

    - name: Get initial Jenkins admin password
      slurp:
        src: "{{ jenkins_home }}/secrets/initialAdminPassword"
      register: jenkins_admin_password_encoded

    - name: Show Jenkins initial admin password
      debug:
        msg: "Jenkins admin password is {{ jenkins_admin_password_encoded.content | b64decode }}"

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Clone PHP Nginx App Repo (feature branch)
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_dest }}"
        version: "{{ github_branch }}"
        key_file: /home/ubuntu/.ssh/id_rsa
        accept_hostkey: yes

    - name: Copy index.php from php-app to Nginx root
      copy:
        src: "{{ index_src }}"
        dest: /var/www/html/index.php
        remote_src: yes
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted

    - name: Write CAAS file with message "Hello RAJ!"
      copy:
        content: "Hello RAJ!"
        dest: /var/www/html/caas.txt

    - name: Install Helm
      shell: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      args:
        creates: /usr/local/bin/helm

    - name: Add Jenkins Helm repo
      shell: helm repo add jenkins https://charts.jenkins.io && helm repo update

    - name: Ensure pip is installed
      apt:
        name: python3-pip
        state: present

    - name: Install Kubernetes Python client
      pip:
        name: kubernetes
        executable: pip3

# Second Play: Upload kubeconfig and create Jenkins namespace
- name: Upload kubeconfig and create Jenkins namespace
  hosts: php-node
  become: true

  vars:
    kubeconfig_local_path: "/home/ubuntu/.kube/config"
    kubeconfig_remote_path: "/home/ubuntu/.kube/config"
    kubeconfig_path: "/home/ubuntu/.kube/config"

  pre_tasks:
    - name: Ensure ~/.kube/config exists on remote (if control plane)
      shell: |
        mkdir -p /home/ubuntu/.kube
        cp -i /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
        chown ubuntu:ubuntu /home/ubuntu/.kube/config
      args:
        creates: /home/ubuntu/.kube/config
      ignore_errors: true

    - name: Check if kubeconfig exists on Ansible controller
      stat:
        path: "{{ kubeconfig_local_path }}"
      register: kubeconfig_local_stat
      delegate_to: localhost

    - name: Create local .kube directory if kubeconfig is missing
      file:
        path: "{{ kubeconfig_local_path | dirname }}"
        state: directory
        mode: '0700'
      when: not kubeconfig_local_stat.stat.exists
      delegate_to: localhost

    - name: Fetch kubeconfig from remote if missing locally
      fetch:
        src: "{{ kubeconfig_remote_path }}"
        dest: "{{ kubeconfig_local_path }}"
        flat: yes
      when: not kubeconfig_local_stat.stat.exists
      delegate_to: localhost
      ignore_errors: true

    - name: Set permissions for local kubeconfig
      file:
        path: "{{ kubeconfig_local_path }}"
        mode: '0600'
      when: not kubeconfig_local_stat.stat.exists
      delegate_to: localhost
      ignore_errors: true

  tasks:
    - name: Ensure .kube directory exists on remote
      file:
        path: "{{ kubeconfig_remote_path | dirname }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy kubeconfig to remote
      copy:
        src: "{{ kubeconfig_local_path }}"
        dest: "{{ kubeconfig_remote_path }}"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      delegate_to: localhost
      when: kubeconfig_local_stat.stat.exists
      ignore_errors: true

    - name: Create jenkins namespace
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: jenkins
        kubeconfig: "{{ kubeconfig_remote_path }}"
      when: kubeconfig_local_stat.stat.exists and lookup('file', kubeconfig_local_path) | length > 0

    - name: Create PVC for Jenkins EBS
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', playbook_dir + '/jenkins-pvc.yaml') }}"
        kubeconfig: "{{ kubeconfig_path }}"
      delegate_to: localhost

    - name: Copy Helm values file
      copy:
        src: jenkins-values.yaml
        dest: /tmp/jenkins-values.yaml

    - name: Apply Jenkins Helm Chart with values.yaml
      shell: |
        helm upgrade --install jenkins jenkins/jenkins \
          --namespace jenkins \
          --values /tmp/jenkins-values.yaml
      args:
        executable: /bin/bash
