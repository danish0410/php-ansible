---
- name: Update system, install PHP & Nginx, and stop Apache
  hosts: all
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install PHP
      apt:
        name: php
        state: present

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Apache is stopped if running
      service:
        name: apache2
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Show Nginx service status
      shell: systemctl status nginx
      register: nginx_status
      changed_when: false

    - name: Check port 80 usage
      shell: lsof -i :80
      register: port80_info
      changed_when: false
      ignore_errors: true
