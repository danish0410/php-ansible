---
- name: Setup Nginx + PHP + Git + Pull Repo and Display S3 Image
  hosts: all
  become: true

  vars:
    github_repo: "git@github.com:danish0410/php-nginx-helloworld.git"
    github_branch: "feature"
    app_dest: "/var/www/html/php-nginx-helloworld"
    index_src: "/var/www/html/php-nginx-helloworld/php-app/index.php"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install PHP
      apt:
        name: php
        state: present

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Install Git
      apt:
        name: git
        state: present

    - name: Ensure Apache is stopped and disabled
      service:
        name: apache2
        state: stopped
        enabled: no
      ignore_errors: true

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Clone PHP Nginx App Repo (feature branch)
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_dest }}"
        version: "{{ github_branch }}"
        key_file: /home/ubuntu/.ssh/id_rsa   # Make sure this key exists and is authorized
        accept_hostkey: yes

    - name: Copy index.php from php-app to Nginx root
      copy:
        src: "{{ index_src }}"
        dest: /var/www/html/index.php
        remote_src: yes
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
