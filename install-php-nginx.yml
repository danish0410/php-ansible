---
- name: Install Jenkins on EBS volume and setup Nginx + PHP + Git App
  hosts: all
  become: true

  vars:
    github_repo: "git@github.com:danish0410/php-nginx-helloworld.git"
    github_branch: "feature"
    app_dest: "/var/www/html/php-nginx-helloworld"
    index_src: "/var/www/html/php-nginx-helloworld/php-app/index.php"
    jenkins_home: "/mnt/jenkins"
    ebs_device: "/dev/xvdf"  # Adjust based on your attached EBS volume

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Upgrade all packages
      apt:
        upgrade: dist
        autoremove: yes

    - name: Install required packages
      apt:
        name: ['php', 'nginx', 'git', 'openjdk-11-jdk', 'curl', 'gnupg2']
        state: present

    - name: Ensure Apache is stopped and disabled
      service:
        name: apache2
        state: stopped
        enabled: no
      ignore_errors: true

    - name: Mount EBS volume (if not formatted)
      shell: |
        if ! file -s {{ ebs_device }} | grep -q "filesystem"; then
          mkfs -t ext4 {{ ebs_device }}
        fi
      args:
        warn: false

    - name: Create Jenkins home directory
      file:
        path: "{{ jenkins_home }}"
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Mount EBS volume to Jenkins directory
      mount:
        src: "{{ ebs_device }}"
        path: "{{ jenkins_home }}"
        fstype: ext4
        opts: defaults
        state: mounted

    - name: Add Jenkins APT key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io.key
        state: present

    - name: Add Jenkins APT repository
      apt_repository:
        repo: deb https://pkg.jenkins.io/debian-stable binary/
        state: present

    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Stop Jenkins to configure custom home
      service:
        name: jenkins
        state: stopped

    - name: Update Jenkins config to use custom home
      lineinfile:
        path: /etc/default/jenkins
        regexp: '^JENKINS_HOME='
        line: "JENKINS_HOME={{ jenkins_home }}"
        create: yes

    - name: Copy existing Jenkins files if any
      shell: |
        if [ -d /var/lib/jenkins ] && [ -z "$(ls -A {{ jenkins_home }})" ]; then
          cp -r /var/lib/jenkins/* {{ jenkins_home }}/
          chown -R jenkins:jenkins {{ jenkins_home }}
        fi
      args:
        warn: false

    - name: Start Jenkins and enable at boot
      service:
        name: jenkins
        state: started
        enabled: yes

    - name: Ensure Nginx is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Clone PHP Nginx App Repo (feature branch)
      git:
        repo: "{{ github_repo }}"
        dest: "{{ app_dest }}"
        version: "{{ github_branch }}"
        key_file: /home/ubuntu/.ssh/id_rsa
        accept_hostkey: yes

    - name: Copy index.php from php-app to Nginx root
      copy:
        src: "{{ index_src }}"
        dest: /var/www/html/index.php
        remote_src: yes
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
		
    - name: Write CAAS file with message "Hello RAJ!"
      copy:
        content: "Hello RAJ!"
        dest: /home/ubuntu/CAAS.txt
        owner: ubuntu
        group: ubuntu
        mode: '0644'
